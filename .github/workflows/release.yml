# A Deck Lab release (E11-S49): on a version tag on main (v1.2.0), or by hand with a version, build
# decklab-VERSION.zip, its .sha256 and its manifest (scripts/make_release.py), record the zip's
# build-provenance attestation (E11-S67) and attach them to a DRAFT GitHub release. Nothing is
# published: Matt reads the draft and clicks Publish himself.
name: release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, such as 1.2.0 (tags main's tip as v1.2.0)"
        required: true

permissions:
  contents: write           # create the draft release (and, by hand, its tag)
  checks: read              # the commit's tests and ruff checks must have passed
  id-token: write           # sign the zip's build-provenance attestation (E11-S67)
  attestations: write       # and record it against this repository

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Work out the version and check it's on main and passed CI
        id: version
        env:
          GIVEN: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="${GIVEN#v}"
            git checkout --quiet origin/main
          fi
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]{0,30})?$'; then
            echo "::error::$version isn't a release version like 1.2.0"; exit 1
          fi
          if [ "$GITHUB_EVENT_NAME" != "push" ] && [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error::Run the release from main, not $GITHUB_REF"; exit 1
          fi
          # A commit main itself was at (a pull request's merge), not one inside a merged branch.
          if ! git rev-list --first-parent origin/main | grep -qx "$(git rev-parse HEAD)"; then
            echo "::error::v$version isn't a commit main was at"; exit 1
          fi
          # GitHub Actions' (app 15368) latest run of each required check on exactly this commit
          sha="$(git rev-parse HEAD)"
          for check in tests ruff; do
            conclusion="$(gh api "repos/$GITHUB_REPOSITORY/commits/$sha/check-runs?check_name=$check&per_page=100" \
              --jq '[.check_runs[] | select(.app.id == 15368)] | sort_by(.started_at) | last | .conclusion // "none"')"
            if [ "$conclusion" != success ]; then
              echo "::error::$check on $sha is '$conclusion', not success: wait for main's CI, or fix it"; exit 1
            fi
          done
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Build the zip, its SHA-256 and its manifest
        run: python scripts/make_release.py "${{ steps.version.outputs.version }}" --out dist
      # Signed proof that this workflow built the zip from this commit (E11-S67); anyone can check
      # it with: gh attestation verify decklab-VERSION.zip --repo OWNER/REPO (SELF-HOSTING.md).
      - name: Record the zip's build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/decklab-${{ steps.version.outputs.version }}.zip
      - name: Attach them to a draft release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "v$VERSION" dist/* --draft --target "$(git rev-parse HEAD)" \
            --title "Deck Lab $VERSION" \
            --notes "Deck Lab $VERSION. Download decklab-$VERSION.zip and check it against decklab-$VERSION.zip.sha256. decklab-$VERSION.json lists its commit and database migrations. Optionally, gh attestation verify decklab-$VERSION.zip --repo $GITHUB_REPOSITORY confirms this repository's release workflow built it. See SELF-HOSTING.md."
